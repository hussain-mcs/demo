version: '3.8'

services:
  app:
    image: bitnami/laravel:latest
    ports:
      - "8080:8000"
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
    volumes:
      - ./:/app
    depends_on:
      - mariadb

  mariadb:
    image: bitnami/mariadb:latest
    environment:
      - MARIADB_DATABASE=laravel
      - MARIADB_USER=laravel
      - MARIADB_PASSWORD=secret
      - MARIADB_ROOT_PASSWORD=rootpassword
    volumes:
      - mariadb_data:/bitnami/mariadb

volumes:
  mariadb_data: